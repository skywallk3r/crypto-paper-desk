[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-paper-desk"
version = "0.1.0"
description = "Alpaca paper-only crypto desk — BTC liquidation-flush mean reversion"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Trading Bot Desk" }]
dependencies = [
  "alpaca-py>=0.40.0,<1.0.0",
  "requests>=2.31.0,<3.0.0",
  "python-dotenv>=1.0.0,<2.0.0",
  "numpy>=1.26.0,<3.0.0",
]

[project.scripts]
crypto-paper-desk = "crypto_paper_desk.runner:main"

[tool.setuptools.packages.find]
include = ["crypto_paper_desk*"]
